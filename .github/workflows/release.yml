name: Publish immutable research snapshot
on:
  workflow_run:
    workflows: ['Verify research release']
    types: [completed]
    branches: [main]
  workflow_dispatch:

# The release job never runs for pull requests or fork workflow completions.
permissions:
  contents: read
concurrency:
  group: research-release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false
jobs:
  validation:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Release packaging integrity tests
        run: python -m unittest discover -s tests -p 'test_release_*.py'
      - name: Check preprint and Lean source bundles
        run: python scripts/build_preprint.py --check
      - name: Build partial Lean formalization for manual publication
        if: github.event_name == 'workflow_dispatch'
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1
        with:
          lake-package-directory: formalization/negative-voting
          use-mathlib-cache: 'true'
          build: 'true'
          test: 'false'
          lint: 'false'
      - name: Audit Lean theorem axioms for manual publication
        if: github.event_name == 'workflow_dispatch'
        working-directory: formalization/negative-voting
        run: |
          python3 verify_dependency.py
          python3 verify_mulgund.py
          python3 verify_hypercontractivity.py
          python3 verify_extended_dependencies.py
          python3 verify.py
      - name: Install scientific dependencies for manual verification
        if: github.event_name == 'workflow_dispatch'
        run: python -m pip install -r requirements.txt
      - name: Full scientific verification for manual publication
        if: github.event_name == 'workflow_dispatch'
        run: python verify_release.py
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          PYTHONDONTWRITEBYTECODE: '1'
  release:
    needs: validation
    if: needs.validation.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      SOURCE_SHA: ${{ github.sha }}
      SOURCE_REPOSITORY: ${{ github.repository }}
      WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify checkout identity
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Check immutable publication and idempotency
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py prepare --repository "$SOURCE_REPOSITORY" --commit "$SOURCE_SHA"
      - name: Build exact committed snapshot
        if: steps.prepare.outputs.skip != 'true'
        run: >-
          python scripts/build_release.py --commit "$SOURCE_SHA"
          --repository "$SOURCE_REPOSITORY" --workflow-url "$WORKFLOW_URL"
          --output "$RUNNER_TEMP/research-release"
      - name: Attest every primary asset and the checksum file
        if: steps.prepare.outputs.skip != 'true'
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/research-release/*
      - name: Publish complete draft and verify immutable release
        if: steps.prepare.outputs.skip != 'true'
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$BUNDLE_PATH" "$RUNNER_TEMP/research-release/build-provenance.sigstore.json"
          python scripts/publish_release.py publish --repository "$SOURCE_REPOSITORY" --commit "$SOURCE_SHA" --directory "$RUNNER_TEMP/research-release"
